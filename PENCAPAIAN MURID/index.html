                                   <span className="font-bold text-amber-600 bg-amber-100 px-2 py-1 rounded-md">{murid.totalSkor} pts</span>
                                   <button 
                                     onClick={() => { 
                                         setFilterNama(murid.nama); 
                                         setPrintMode('tokoh'); 
                                         setTimeout(() => window.print(), 100); 
                                     }} 
                                     className="p-1.5 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition" 
                                     title="Jana Laporan Tokoh (Semua Rekod)"
                                   >
                                       <Printer className="w-4 h-4" />
                                   </button>
                               </div>
                             </li>
                          ))}
                        </ul>
                     )}
                  </div>
                </div>
                <p className="text-xs text-gray-500 mt-4 italic">* Pemilihan berdasarkan kumulatif markah merit Peringkat (cth: Antarabangsa=60) & Pencapaian (cth: Johan=6). Jantina dirujuk secara live dari pautan Google Sheets.</p>
              </div>
            )}

            <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="flex items-center justify-between gap-2 mb-6 border-b pb-4">
                <div className="flex items-center gap-2 text-blue-700">
                    <BarChart2 className="w-6 h-6" />
                    <h2 className="text-xl font-semibold">Rumusan Pencapaian Murid</h2>
                </div>
                </div>

                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 mb-6">
                  <div className="flex items-center gap-2 mb-3 text-slate-700">
                      <Filter className="w-4 h-4" />
                      <span className="text-sm font-semibold">Pilihan Paparan & Laporan</span>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                      <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Kelas</label>
                      <select value={filterKelas} onChange={e => setFilterKelas(e.target.value)} className="w-full p-2 text-sm border border-gray-300 rounded-md bg-white">
                          <option value="Semua">Semua Kelas</option>
                          {senaraiKelas.map(k => <option key={k} value={k}>{k}</option>)}
                      </select>
                      </div>
                      <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Nama Murid</label>
                      <select value={filterNama} onChange={e => setFilterNama(e.target.value)} className="w-full p-2 text-sm border border-gray-300 rounded-md bg-white">
                          <option value="Semua">Semua Murid</option>
                          {uniqueNames.map(name => <option key={name} value={name}>{name}</option>)}
                      </select>
                      </div>
                      <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Peringkat</label>
                      <select value={filterPeringkat} onChange={e => setFilterPeringkat(e.target.value)} className="w-full p-2 text-sm border border-gray-300 rounded-md bg-white">
                          <option value="Keseluruhan">Keseluruhan (Semua Peringkat)</option>
                          {PERINGKAT_PILIHAN.map(p => <option key={p} value={p}>{p}</option>)}
                      </select>
                      </div>
                      <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Bidang</label>
                      <select value={filterBidang} onChange={e => setFilterBidang(e.target.value)} className="w-full p-2 text-sm border border-gray-300 rounded-md bg-white">
                          <option value="Semua">Semua Bidang</option>
                          {BIDANG_PILIHAN.map(b => <option key={b} value={b}>{b}</option>)}
                      </select>
                      </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Pencapaian</label>
                      <select value={filterPencapaian} onChange={e => setFilterPencapaian(e.target.value)} className="w-full p-2 text-sm border border-gray-300 rounded-md bg-white">
                          <option value="Semua">Semua Pencapaian</option>
                          {PENCAPAIAN_INDIVIDU_PILIHAN.filter(p => p !== 'Tiada').map(p => <option key={p} value={p}>{p}</option>)}
                      </select>
                      </div>
                      <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Anugerah Khas</label>
                      <select value={filterAnugerah} onChange={e => setFilterAnugerah(e.target.value)} className="w-full p-2 text-sm border border-gray-300 rounded-md bg-white">
                          <option value="Semua">Semua Anugerah</option>
                          <option value="Ada Anugerah">Ada Anugerah</option>
                          <option value="Tiada Anugerah">Tiada Anugerah</option>
                      </select>
                      </div>
                      <div>
                      <label className="block text-xs font-medium text-gray-500 mb-1">Jawatan</label>
                      <select value={filterJawatan} onChange={e => setFilterJawatan(e.target.value)} className="w-full p-2 text-sm border border-gray-300 rounded-md bg-white">
                          <option value="Semua">Semua Jawatan</option>
                          {JAWATAN_PILIHAN.filter(j => j !== 'Tiada').map(j => <option key={j} value={j}>{j}</option>)}
                      </select>
                      </div>
                  </div>

                  <div className="mt-4 pt-4 border-t border-slate-200 flex justify-end">
                    <button 
                      onClick={() => {
                        if (filterNama === 'Semua') {
                          showToast('Sila pilih nama murid spesifik pada ruang Nama Murid di atas untuk menjana Laporan.', 'error');
                        } else {
                          setPrintMode('umum');
                          setTimeout(() => window.print(), 100);
                        }
                      }}
                      className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition ${filterNama === 'Semua' ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-red-600 hover:bg-red-700 text-white shadow-sm'}`}
                    >
                      <Printer className="w-4 h-4" /> Jana Laporan Murid (PDF)
                    </button>
                  </div>
                </div>

                {summaryData.length === 0 ? (
                <div className="text-center py-12 text-gray-400">
                    <Award className="w-16 h-16 mx-auto mb-3 opacity-20" />
                    <p>Tiada rekod dipaparkan berdasarkan pilihan ini.</p>
                </div>
                ) : (
                <div className="flex flex-col lg:flex-row gap-8 items-start">
                    <div className="overflow-x-auto w-full flex-1">
                    <table className="w-full text-sm text-left">
                        <thead className="bg-gray-50 text-gray-700 uppercase text-xs border-y">
                        <tr>
                            <th className="px-4 py-3 border-r">Nama Murid</th>
                            <th className="px-4 py-3 border-r">Bidang</th>
                            <th className="px-4 py-3 border-r">Peringkat</th>
                            <th className="px-3 py-3 text-center border-r text-amber-600">Johan</th>
                            <th className="px-3 py-3 text-center border-r text-slate-500">Naib Johan</th>
                            <th className="px-3 py-3 text-center border-r text-orange-700">Ke-3</th>
                            <th className="px-3 py-3 text-center border-r">Ke-4</th>
                            <th className="px-3 py-3 text-center border-r">Ke-5</th>
                            <th className="px-3 py-3 text-center border-r">Penyertaan</th>
                            <th className="px-3 py-3 text-center">Anugerah Khas</th>
                        </tr>
                        </thead>
                        <tbody>
                        {summaryData.map((row, idx) => (
                            <tr key={idx} className="border-b hover:bg-gray-50">
                            <td className="px-4 py-3 font-medium text-gray-900 border-r">{row.nama}</td>
                            <td className="px-4 py-3 border-r">
                                <span className="bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-medium">{row.bidang}</span>
                            </td>
                            <td className="px-4 py-3 border-r">
                                <span className="bg-purple-100 text-purple-800 px-2 py-1 rounded text-xs font-medium">
                                {row.peringkat}
                                </span>
                            </td>
                            <td className="px-3 py-3 text-center border-r font-semibold">{row.johan || '-'}</td>
                            <td className="px-3 py-3 text-center border-r font-semibold">{row.naibJohan || '-'}</td>
                            <td className="px-3 py-3 text-center border-r font-semibold">{row.ke3 || '-'}</td>
                            <td className="px-3 py-3 text-center border-r">{row.ke4 || '-'}</td>
                            <td className="px-3 py-3 text-center border-r">{row.ke5 || '-'}</td>
                            <td className="px-3 py-3 text-center border-r">{row.penyertaan || '-'}</td>
                            <td className="px-3 py-3 text-center font-bold text-indigo-600">{row.anugerahKhas > 0 ? row.anugerahKhas : '-'}</td>
                            </tr>
                        ))}
                        </tbody>
                    </table>
                    </div>

                    <div className="w-full lg:w-[350px] shrink-0">
                    <SpiderChart data={spiderData} />
                    </div>
                </div>
                )}
            </div>
        </>
        ) : (
        /* PAPARAN RUMUSAN GURU PENGIRING */
        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div className="flex items-center justify-between gap-2 mb-6 border-b pb-4">
                <div className="flex items-center gap-2 text-emerald-700">
                    <UserCheck className="w-6 h-6" />
                    <h2 className="text-xl font-semibold">Rumusan Penglibatan Guru Pengiring/Jurulatih</h2>
                </div>
            </div>

            <div className="bg-emerald-50 p-4 rounded-lg border border-emerald-100 mb-6 flex flex-col md:flex-row gap-4 items-end">
                <div className="flex-1 w-full">
                    <label className="block text-xs font-medium text-emerald-800 mb-1">Pilih Nama Guru untuk Melihat / Menjana Laporan</label>
                    <select value={filterGuru} onChange={e => setFilterGuru(e.target.value)} className="w-full p-2 text-sm border border-emerald-300 rounded-md bg-white">
                        <option value="Semua">Tunjuk Semua Guru</option>
                        {guruReportData.map(g => <option key={g.nama} value={g.nama}>{g.nama}</option>)}
                    </select>
                </div>
                <button 
                  onClick={() => {
                    if (filterGuru === 'Semua') {
                      showToast('Sila pilih nama guru yang spesifik untuk menjana Laporan PDF.', 'error');
                    } else {
                      setPrintMode('guru');
                      setTimeout(() => window.print(), 100);
                    }
                  }}
                  className={`flex items-center justify-center gap-2 px-6 py-2 rounded-md text-sm font-bold transition w-full md:w-auto shrink-0 ${filterGuru === 'Semua' ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm'}`}
                >
                  <Printer className="w-4 h-4" /> Jana Laporan Guru (PDF)
                </button>
            </div>

            {guruReportData.length === 0 ? (
                <div className="text-center py-12 text-gray-400">
                    <UserCheck className="w-16 h-16 mx-auto mb-3 opacity-20" />
                    <p>Tiada rekod guru pengiring didapati setakat ini.</p>
                </div>
            ) : filterGuru === 'Semua' ? (
                <div className="overflow-x-auto w-full">
                    <table className="w-full text-sm text-left">
                        <thead className="bg-gray-50 text-gray-700 uppercase text-xs border-y">
                            <tr>
                                <th className="px-4 py-3 border-r w-16 text-center">Bil</th>
                                <th className="px-4 py-3 border-r">Nama Guru Pengiring/Jurulatih</th>
                                <th className="px-4 py-3 text-center">Jumlah Program Dihadiri</th>
                            </tr>
                        </thead>
                        <tbody>
                            {guruReportData.map((g, idx) => (
                                <tr key={idx} className="border-b hover:bg-gray-50">
                                    <td className="px-4 py-3 text-center border-r font-medium text-gray-500">{idx + 1}</td>
                                    <td className="px-4 py-3 font-semibold text-gray-900 border-r">{g.nama}</td>
                                    <td className="px-4 py-3 text-center">
                                        <span className="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-bold">{g.total} Program</span>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            ) : (
                <div className="overflow-x-auto w-full">
                    <table className="w-full text-sm text-left">
                        <thead className="bg-emerald-600 text-white uppercase text-xs border-y">
                            <tr>
                                <th className="px-4 py-3 border-r border-emerald-500 w-16 text-center">Bil</th>
                                <th className="px-4 py-3 border-r border-emerald-500">Bidang</th>
                                <th className="px-4 py-3 border-r border-emerald-500">Nama Program / Kelab</th>
                                <th className="px-4 py-3 border-r border-emerald-500 text-center">Tarikh / Sesi</th>
                                <th className="px-4 py-3 text-center border-emerald-500">Peringkat</th>
                            </tr>
                        </thead>
                        <tbody>
                            {selectedGuruData && selectedGuruData.programs.map((p, idx) => (
                                <tr key={idx} className="border-b hover:bg-emerald-50">
                                    <td className="px-4 py-3 text-center border-r border-gray-200">{idx + 1}</td>
                                    <td className="px-4 py-3 border-r border-gray-200 font-medium text-emerald-700">{p.bidang}</td>
                                    <td className="px-4 py-3 border-r border-gray-200 font-semibold text-gray-900">{p.namaProgram}</td>
                                    <td className="px-4 py-3 border-r border-gray-200 text-center">{p.tarikh}</td>
                                    <td className="px-4 py-3 text-center text-gray-600">{p.peringkat}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            )}
        </div>
        )}
      </div>
    );
  };

  return (
    <>
      <div className="min-h-screen bg-slate-50 font-sans pb-12 print:hidden">
        <header className="bg-blue-900 text-white p-6 shadow-md">
          <div className="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-bold">Sistem Rekod Pencapaian Kokurikulum Murid</h1>
              <p className="text-blue-200 text-sm mt-1">Rujukan lengkap dan pantas pencapaian kokurikulum murid.</p>
            </div>
            <div className="flex bg-blue-800 rounded-lg p-1 flex-wrap gap-1">
              <button onClick={() => setActiveTab('form')} className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition ${activeTab === 'form' ? 'bg-white text-blue-900 shadow' : 'text-white hover:bg-blue-700'}`}><FileText className="w-4 h-4" /> Pengisian Data</button>
              <button onClick={() => setActiveTab('records')} className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition ${activeTab === 'records' ? 'bg-white text-blue-900 shadow' : 'text-white hover:bg-blue-700'}`}><ListIcon className="w-4 h-4" /> Senarai Rekod</button>
              <button onClick={() => setActiveTab('summary')} className={`flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition ${activeTab === 'summary' ? 'bg-white text-blue-900 shadow' : 'text-white hover:bg-blue-700'}`}><BarChart2 className="w-4 h-4" /> Rumusan</button>
            </div>
          </div>
        </header>

        <main className="max-w-5xl mx-auto mt-8 px-4">
          {toast.show && (
            <div className={`mb-6 p-4 rounded-lg font-medium text-sm border shadow-sm transition-all flex items-center justify-center ${toast.type === 'error' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}`}>
              {toast.message}
            </div>
          )}
          {activeTab === 'form' && renderForm()}
          {activeTab === 'records' && renderRecordList()}
          {activeTab === 'summary' && renderSummary()}
        </main>
      </div>

      <div className="hidden print:block w-full bg-white text-black p-4 font-sans print-1-page">
         {printMode === 'guru' && selectedGuruData ? (
             <div className="h-full flex flex-col">
                 <div className="flex flex-col items-center border-b-[3px] border-black pb-2 mb-3">
                     <div className="w-20 h-20 flex items-center justify-center overflow-hidden mb-1">
                         <img src="logo sekolah.jpg" alt="Logo Sekolah" className="w-full h-full object-contain" onError={(e) => { e.target.onerror = null; e.target.src = 'latest 6.5.jpg'; }} />
                     </div>
                     <h1 className="text-xl font-extrabold uppercase text-center">Sekolah Kebangsaan Pendidikan Khas Miri</h1>
                     <p className="text-[11px] font-bold mt-1 bg-gray-800 text-white inline-block px-3 py-0.5 rounded">LAPORAN PENGLIBATAN GURU PENGIRING / PENASIHAT</p>
                 </div>

                 <div className="mb-4 border-l-4 border-black pl-3">
                     <table className="text-xs">
                        <tbody>
                           <tr><td className="w-32 font-bold py-0.5">Nama Guru</td><td className="w-3">:</td><td className="py-0.5 font-semibold text-sm uppercase">{selectedGuruData.nama}</td></tr>
                           <tr><td className="w-32 font-bold py-0.5">Jumlah Penglibatan</td><td className="w-3">:</td><td className="py-0.5">{selectedGuruData.total} Program / Kelab</td></tr>
                        </tbody>
                     </table>
                 </div>

                 <div className="mb-4 flex-1">
                     <h3 className="font-bold text-xs mb-1.5 bg-gray-200 p-1.5">Senarai Penglibatan</h3>
                     <table className="w-full text-[10px] border-collapse border border-black mt-1">
                        <thead>
                           <tr className="bg-gray-100">
                              <th className="border border-black p-1 text-center w-8">Bil</th>
                              <th className="border border-black p-1 text-center">Bidang</th>
                              <th className="border border-black p-1 text-left">Nama Program / Kelab</th>
                              <th className="border border-black p-1 text-center">Tarikh / Sesi</th>
                              <th className="border border-black p-1 text-center">Peringkat</th>
                           </tr>
                        </thead>
                        <tbody>
                           {selectedGuruData.programs.length === 0 ? (
                              <tr><td colSpan="5" className="text-center p-3 border border-black font-medium italic text-gray-500">Tiada rekod penglibatan guru.</td></tr>
                           ) : (
                              selectedGuruData.programs.map((p, i) => (
                                 <tr key={i}>
                                    <td className="border border-black p-1 text-center">{i+1}</td>
                                    <td className="border border-black p-1 text-center font-bold">{p.bidang}</td>
                                    <td className="border border-black p-1 font-medium">{p.namaProgram}</td>
                                    <td className="border border-black p-1 text-center whitespace-nowrap">{p.tarikh}</td>
                                    <td className="border border-black p-1 text-center font-semibold">{p.peringkat}</td>
                                 </tr>
                              ))
                           )}
                        </tbody>
                     </table>
                 </div>
                 
                 <div className="mt-4 flex justify-end shrink-0">
                     <div className="text-center w-56">
                         <p className="mb-10 text-[11px] text-left">Disahkan oleh,</p>
                         <p className="border-b border-black w-full"></p>
                         <p className="mt-1 font-bold text-[11px]">( AZIZ BIN TAHIR )</p>
                         <p className="text-[10px] mt-0.5 font-semibold uppercase">Guru Besar</p>
                         <p className="text-[10px] font-semibold uppercase">Sekolah Kebangsaan Pendidikan Khas Miri</p>
                         <p className="text-[9px] mt-1 text-gray-500">Tarikh Cetakan: {new Date().toLocaleDateString('ms-MY')}</p>
                     </div>
                 </div>
             </div>

         ) : printMode === 'tokoh' ? (
             <div className="h-full flex flex-col">
                 <div className="flex flex-col items-center border-b-[3px] border-black pb-2 mb-3">
                     <div className="w-20 h-20 flex items-center justify-center overflow-hidden mb-1">
                         <img src="logo sekolah.jpg" alt="Logo Sekolah" className="w-full h-full object-contain" onError={(e) => { e.target.onerror = null; e.target.src = 'latest 6.5.jpg'; }} />
                     </div>
                     <h1 className="text-xl font-extrabold uppercase text-center">Sekolah Kebangsaan Pendidikan Khas Miri</h1>
                     <p className="text-[11px] font-bold mt-1 bg-gray-800 text-white inline-block px-3 py-0.5 rounded">LAPORAN CALON TOKOH KOKURIKULUM</p>
                 </div>

                 <div className="mb-4 border-l-4 border-black pl-3">
                     <table className="text-xs">
                        <tbody>
                           <tr><td className="w-28 font-bold py-0.5">Nama Murid</td><td className="w-3">:</td><td className="py-0.5 font-semibold">{filterNama !== 'Semua' ? filterNama : ''}</td></tr>
                           <tr><td className="w-28 font-bold py-0.5">Kelas</td><td className="w-3">:</td><td className="py-0.5">{cetakStudentInfo.kelas}</td></tr>
                           <tr><td className="w-28 font-bold py-0.5">Jantina</td><td className="w-3">:</td><td className="py-0.5">{cetakStudentInfo.jantina}</td></tr>
                        </tbody>
                     </table>
                 </div>

                 <div className="mb-4 flex-1">
                     <h3 className="font-bold text-xs mb-1.5 bg-gray-200 p-1.5">Senarai Penglibatan & Pencapaian Keseluruhan</h3>
                     <table className="w-full text-[10px] border-collapse border border-black mt-1">
                        <thead>
                           <tr className="bg-gray-100">
                              <th className="border border-black p-1 text-center w-8">Bil</th>
                              <th className="border border-black p-1 text-center">Bidang</th>
                              <th className="border border-black p-1 text-left">Nama Program / Jawatan</th>
                              <th className="border border-black p-1 text-center">Tarikh / Sesi</th>
                              <th className="border border-black p-1 text-center">Kategori</th>
                              <th className="border border-black p-1 text-center">Peringkat</th>
                              <th className="border border-black p-1 text-center">Pencapaian</th>
                           </tr>
                        </thead>
                        <tbody>
                           {allStudentRecords.length === 0 ? (
                              <tr><td colSpan="7" className="text-center p-3 border border-black font-medium italic text-gray-500">Tiada rekod penglibatan kokurikulum untuk murid ini.</td></tr>
                           ) : (
                              allStudentRecords.map((r, i) => (
                                 <tr key={i}>
                                    <td className="border border-black p-1 text-center">{i+1}</td>
                                    <td className="border border-black p-1 text-center font-bold">{r.bidang}</td>
                                    <td className="border border-black p-1 font-medium">{r.namaProgramPaparan}</td>
                                    <td className="border border-black p-1 text-center whitespace-nowrap">{r.tarikhPaparan}</td>
                                    <td className="border border-black p-1 text-center">{r.kategoriPaparan}</td>
                                    <td className="border border-black p-1 text-center font-semibold">{r.peringkatPaparan}</td>
                                    <td className="border border-black p-1 text-center font-bold">{r.pencapaianSebenar}</td>
                                 </tr>
                              ))
                           )}
                        </tbody>
                     </table>
                 </div>
                 
                 <div className="mt-4 flex justify-end shrink-0">
                     <div className="text-center w-56">
                         <p className="mb-10 text-[11px] text-left">Disahkan oleh,</p>
                         <p className="border-b border-black w-full"></p>
                         <p className="mt-1 font-bold text-[11px]">( AZIZ BIN TAHIR )</p>
                         <p className="text-[10px] mt-0.5 font-semibold uppercase">Guru Besar</p>
                         <p className="text-[10px] font-semibold uppercase">Sekolah Kebangsaan Pendidikan Khas Miri</p>
                         <p className="text-[9px] mt-1 text-gray-500">Tarikh Cetakan: {new Date().toLocaleDateString('ms-MY')}</p>
                     </div>
                 </div>
             </div>
         ) : (
             <div className="h-full flex flex-col">
                 <div className="flex flex-col items-center border-b-[3px] border-black pb-2 mb-3">
                     <div className="w-20 h-20 flex items-center justify-center overflow-hidden mb-1">
                         <img src="logo sekolah.jpg" alt="Logo Sekolah" className="w-full h-full object-contain" onError={(e) => { e.target.onerror = null; e.target.src = 'latest 6.5.jpg'; }} />
                     </div>
                     <h1 className="text-xl font-extrabold uppercase text-center">Sekolah Kebangsaan Pendidikan Khas Miri</h1>
                     <p className="text-[11px] font-bold mt-1 bg-gray-800 text-white inline-block px-3 py-0.5 rounded">LAPORAN PENCAPAIAN KOKURIKULUM INDIVIDU</p>
                 </div>

                 <div className="mb-4 border-l-4 border-black pl-3">
                     <table className="text-xs">
                        <tbody>
                           <tr><td className="w-28 font-bold py-0.5">Nama Murid</td><td className="w-3">:</td><td className="py-0.5 font-semibold">{filterNama !== 'Semua' ? filterNama : ''}</td></tr>
                           <tr><td className="w-28 font-bold py-0.5">Kelas</td><td className="w-3">:</td><td className="py-0.5">{cetakStudentInfo.kelas}</td></tr>
                           <tr><td className="w-28 font-bold py-0.5">Jantina</td><td className="w-3">:</td><td className="py-0.5">{cetakStudentInfo.jantina}</td></tr>
                        </tbody>
                     </table>
                 </div>

                 <div className="mb-4 flex-1">
                     <h3 className="font-bold text-xs mb-1.5 bg-gray-200 p-1.5">A. Senarai Penglibatan & Pencapaian Pertandingan (Tertinggi Setiap Bidang)</h3>
                     <table className="w-full text-[10px] border-collapse border border-black mt-1">
                        <thead>
                           <tr className="bg-gray-100">
                              <th className="border border-black p-1 text-center w-8">Bil</th>
                              <th className="border border-black p-1 text-center">Bidang</th>
                              <th className="border border-black p-1 text-left">Nama Program / Jawatan</th>
                              <th className="border border-black p-1 text-center">Tarikh / Sesi</th>
                              <th className="border border-black p-1 text-center">Kategori</th>
                              <th className="border border-black p-1 text-center">Peringkat</th>
                              <th className="border border-black p-1 text-center">Pencapaian</th>
                           </tr>
                        </thead>
                        <tbody>
                           {reportRecords.map((r, i) => (
                              <tr key={i}>
                                 <td className="border border-black p-1 text-center">{i+1}</td>
                                 <td className="border border-black p-1 text-center font-bold">{r.bidang}</td>
                                 <td className="border border-black p-1 font-medium">{r.namaProgram}</td>
                                 <td className="border border-black p-1 text-center whitespace-nowrap">{r.tarikhPaparan}</td>
                                 <td className="border border-black p-1 text-center">{r.kategori}</td>
                                 <td className="border border-black p-1 text-center font-semibold">{r.peringkat}</td>
                                 <td className="border border-black p-1 text-center font-bold">{r.pencapaianSebenar}</td>
                              </tr>
                           ))}
                        </tbody>
                     </table>
                 </div>

                 <div className="flex justify-between items-end pt-2 shrink-0" style={{ pageBreakInside: 'avoid' }}>
                     <div className="w-1/2 pr-4">
                         <h3 className="font-bold text-[11px] mb-1 bg-gray-200 p-1.5">B. Analisis Kekuatan & Potensi (Spider Chart)</h3>
                         <div className="border border-black p-2 mt-1">
                             <SpiderChart data={spiderData} />
                             <div className="mt-2 pt-2 border-t border-dashed border-gray-400 text-[10px]">
                                 <p className="font-bold mb-1">Rumusan Mata Semasa:</p>
                                 <ul className="grid grid-cols-2 gap-1">
                                    <li>• Sukan: {spiderData['Sukan'] || 0} pts</li>
                                    <li>• Ko-akademik: {spiderData['Ko-akademik'] || 0} pts</li>
                                    <li>• Digital: {spiderData['Digital'] || 0} pts</li>
                                    <li>• Beruniform: {spiderData['Unit Beruniform'] || 0} pts</li>
                                 </ul>
                             </div>
                         </div>
                     </div>
                     
                     <div className="w-1/2 flex flex-col justify-end items-end pb-2">
                         <div className="text-center w-56">
                             <p className="mb-10 text-[11px] text-left">Disahkan oleh,</p>
                             <p className="border-b border-black w-full"></p>
                             <p className="mt-1 font-bold text-[11px]">( AZIZ BIN TAHIR )</p>
                             <p className="text-[10px] mt-0.5 font-semibold uppercase">Guru Besar</p>
                             <p className="text-[10px] font-semibold uppercase">Sekolah Kebangsaan Pendidikan Khas Miri</p>
                             <p className="text-[9px] mt-1 text-gray-500">Tarikh Cetakan: {new Date().toLocaleDateString('ms-MY')}</p>
                         </div>
                     </div>
                 </div>
             </div>
         )}
      </div>
    </>
  );
}

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
